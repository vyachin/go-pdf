<style>
    :root {
        color-scheme: light;
        --accent: #259dff;
    }

    * {
        box-sizing: border-box;
    }

    html {
        background: #d6d6d6;
        font-size: 32px;
    }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        padding: 24px 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        align-items: safe center;

        color: #000;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .certificate {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(210mm, 100%);
        aspect-ratio: 210 / 297;
        padding-bottom: 1em;
        font-size: 1rem;
        text-align: center;
        background: #ececec;
        box-shadow: 0 6px 32px rgb(0 0 0 / 0.28);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .certificate__background {
        position: absolute;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .certificate__logo {
        margin-top: 2.5rem;
        width: 9.0625rem;
        height: auto;
    }

    .certificate__title {
        margin: 2.25rem 0 0;
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.15;
        color: var(--accent);
        text-transform: uppercase;
    }

    .certificate__field {
        margin: 1.5rem 0 0;
    }

    .certificate__field + .certificate__field {
        margin-top: 0.625rem;
    }

    .certificate__qr {
        margin-top: 1.5rem;
        width: 5rem;
        height: auto;
    }

    @media (max-width: 793px) {
        html {
            font-size: clamp(13px, 4.032vw, 32px);
        }

        body {
            padding: 0;
        }

        .certificate {
            box-shadow: none;
        }
    }

    @media print {
        @page {
            size: A4;
            margin: 0;
        }

        html {
            font-size: 32px;
            background: #fff;
        }

        body {
            display: block;
            padding: 0;
            background: #fff;
        }

        .certificate {
            width: 210mm;
            height: 297mm;
            aspect-ratio: auto;
            box-shadow: none;
        }
    }
