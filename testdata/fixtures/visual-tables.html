<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Таблица с рамками и фоном</title>
  <style>
    @page { size: A5; margin: 12mm }
    .box { display: block; width: 60%; height: 15mm; background-color: #dddddd; margin: 0 0 3mm 0 }
    table { width: 100%; border-collapse: collapse }
    th, td { border: 1pt solid #000000; padding: 2mm; font-size: 10pt; vertical-align: middle }
    th { background-color: #eeeeee; text-align: left; font-weight: 700 }
    td.num { text-align: right; color: #333333 }
  </style>
</head>
<body>
  <div class="box"></div>
  <table>
    <thead>
      <tr><th>Наименование</th><th>Сумма</th></tr>
    </thead>
    <tbody>
      <tr><td>Услуга</td><td class="num">10 000,00</td></tr>
      <tr><td>Поддержка</td><td class="num">5 000,00</td></tr>
    </tbody>
  </table>
</body>
</html>
