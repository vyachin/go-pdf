<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Orphans и widows</title>
  <style>
    @page { size: 80mm 90mm; margin: 8mm }
    p { font-size: 9pt; line-height: 1.4; margin: 0 0 2mm 0; text-indent: 4mm }
    .tight { orphans: 4; widows: 3 }
  </style>
</head>
<body>
  <p class="tight">Первый абзац достаточно длинный, чтобы занять несколько строк на узкой странице и проверить поведение свойства orphans при переносе.</p>
  <p class="tight">Второй абзац тоже длинный: движок должен оставить минимум три строки на следующей странице, а не одну висячую строку.</p>
</body>
</html>
