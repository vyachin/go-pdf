<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Строчные элементы</title>
  <style>
    @page { size: A5; margin: 12mm }
    p { margin: 0 0 2mm 0; font-size: 10pt }
    strong { font-weight: 700 }
    em { font-style: italic }
    a { color: #004488 }
    .middle { vertical-align: middle }
    .pre { white-space: pre }
    hr { border: 0.5pt solid #000000 }
  </style>
</head>
<body>
  <p id="top"><strong>Жирный</strong>, <b>тоже жирный</b>, <em>курсив</em>, <i>тоже курсив</i>.</p>
  <p><span class="middle">Строчный элемент</span> и <a href="#top">ссылка</a>.<br>После разрыва строки.</p>
  <p class="pre">  две строки
   с отступом</p>
  <hr>
  <p>Абзац после горизонтальной линии.</p>
</body>
</html>
