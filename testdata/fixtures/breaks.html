<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Разрывы страниц</title>
  <style>
    @page { size: A5; margin: 12mm }
    h2 { font-size: 12pt; margin: 0 0 2mm 0 }
    p { margin: 0 0 2mm 0; font-size: 10pt }
    .before { break-before: page }
    .after { break-after: page }
    .inside { break-inside: avoid }
    .legacy-before { page-break-before: always }
    .legacy-after { page-break-after: always }
    .legacy-inside { page-break-inside: avoid }
  </style>
</head>
<body>
  <h2 class="before">Раздел на новой странице</h2>
  <p class="after">Абзац, после которого идёт разрыв.</p>
  <p>Первый абзац.</p>
  <p>Второй абзац.</p>
  <p class="legacy-before">Разрыв через page-break-before.</p>
  <p class="legacy-after">Разрыв через page-break-after.</p>
  <p class="inside legacy-inside">Блок, который не должен разрываться.</p>
</body>
</html>
