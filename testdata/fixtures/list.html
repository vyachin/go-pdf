<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Маркированный список</title>
  <style>
    @page { size: A5; margin: 12mm }
    ul { margin: 0 0 3mm 0; padding: 0 0 0 8mm; list-style-type: disc }
    li { margin: 0 0 1mm 0; font-size: 10pt }
  </style>
</head>
<body>
  <ul>
    <li>Первый пункт</li>
    <li>Второй пункт</li>
    <li>Третий пункт</li>
  </ul>
</body>
</html>
