<html>
  <head>
    <meta charset="utf-8">
    <title>Text decoration and quotations</title>
    <style>
      body { font-family: sans-serif; font-size: 11pt }
      .combo { text-decoration: underline line-through }
      blockquote { margin: 2mm 10mm }
    </style>
  </head>
  <body>
    <p>Plain text, <u>underlined</u>, <s>struck</s>, <del>deleted</del>, <ins>inserted</ins>.</p>
    <p class="combo">Both lines at once.</p>
    <blockquote>
      <p>A quoted paragraph that keeps its block layout.</p>
      <p>And a second one inside the same quotation.</p>
    </blockquote>
    <p style="color: #c00000"><u>Underlined in colour.</u></p>
  </body>
</html>
