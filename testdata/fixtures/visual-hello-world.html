<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello world</title>
  <style>
    @page { size: A4; margin: 0 }
    body { margin: 0 }
    table.cover { width: 210mm; border-collapse: collapse }
    td.cover {
      height: 297mm;
      padding: 0;
      vertical-align: middle;
      text-align: center;
      background-image: url(hello-world.jpg);
      background-size: cover;
    }
    h1 { margin: 0; font-size: 84pt; font-weight: 700; color: #1c2b3a }
  </style>
</head>
<body>
  <table class="cover">
    <tr><td class="cover"><h1>Hello world</h1></td></tr>
  </table>
</body>
</html>
