<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Локальный шрифт</title>
  <style>
    @font-face { font-family: "Corpus Sans"; src: url("DejaVuSans.ttf") }
    @page { size: A5; margin: 12mm }
    body { font-family: "Corpus Sans"; font-size: 10pt }
    p { margin: 0 0 2mm 0 }
  </style>
</head>
<body>
  <p>Текст в шрифте, объявленном через @font-face.</p>
  <p>Второй абзац того же шрифта.</p>
</body>
</html>
