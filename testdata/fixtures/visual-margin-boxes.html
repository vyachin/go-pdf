<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Поля страницы</title>
  <style>
    @page {
      size: A5 landscape;
      margin: 12mm;
      @top-left { content: "Слева сверху" }
      @top-center { content: "По центру" }
      @top-right { content: "Справа сверху" }
      @bottom-left { content: "Стр. " counter(page) }
      @bottom-center { content: counter(page) " из " counter(pages) }
      @bottom-right { content: "Справа снизу" }
    }
    p { margin: 0 0 2mm 0; font-size: 10pt }
  </style>
</head>
<body>
  <p>Страница с заполненными полями.</p>
  <p>Второй абзац для проверки полей.</p>
</body>
</html>
