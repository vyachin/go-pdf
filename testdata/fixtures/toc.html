<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Оглавление</title>
  <style>
    @page { size: 90mm 70mm; margin: 8mm; @bottom-center { content: counter(page) " / " counter(pages) } }
    p { margin: 0 0 2mm 0; font-size: 10pt }
    h2 { font-size: 12pt; margin: 0 0 2mm 0 }
    a { color: #000000 }
    a.toc::after { content: " — стр. " target-counter(attr(href), page) }
  </style>
</head>
<body>
  <p><a class="toc" href="#one">Раздел 1</a></p>
  <p><a class="toc" href="#two">Раздел 2</a></p>
  <h2 id="one">Раздел 1</h2>
  <p>Текст первого раздела.</p>
  <h2 id="two">Раздел 2</h2>
  <p>Текст второго раздела.</p>
</body>
</html>
