schema: spec-driven

# Project context (optional)
context: |
  Project documentation is written in English. This covers README.md, every file
  under docs/, and the OpenSpec artifacts (proposal, design, specs, tasks).

  Existing Russian documents are migrated when they are next edited: a change
  that touches such a document translates the file it touches. Russian text in
  test fixtures, golden files and converted document templates is content, not
  documentation, and stays as it is.

# Per-artifact rules (optional)
rules:
  proposal:
    - Write the proposal in English.
  design:
    - Write the design in English.
  specs:
    - Write the Purpose section, requirements and scenarios in English.
    - Use SHALL and MUST for normative statements.
  tasks:
    - Write task descriptions in English.
