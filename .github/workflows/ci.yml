name: CI

on:
  # One run per change: a commit on the integration branch, and every pull
  # request. A push to a feature branch is covered by its pull request, so it
  # does not start a second, identical run; tags start none.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The test work is split into independent jobs that start together; the gate
# below is the single check branch protection requires. Poppler is installed
# only where pages are rasterized, and pdfcpu only where the validator is
# required, so each job pays for the tools it uses and no more.

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The module declares go 1.26: CI must prove that minimum works.
          go-version-file: go.mod
          # Left off deliberately: the graph is two small modules, and the
          # parallel jobs would restore and race to save the same cache for a
          # few seconds each. A cache becomes worth it only if a measurement
          # shows the download dominating a job.
          cache: false
      - name: Install pdfcpu
        # Pinned and coupled to the go directive: this release requires
        # Go 1.26, which is exactly the module's minimum. Bump both together.
        run: go install github.com/pdfcpu/pdfcpu/cmd/pdfcpu@v0.16.4
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Vet
        run: go vet ./...
      - name: Test
        # The render tests need poppler, which only the golden job installs;
        # they skip here and golden owns them. The shuffle makes an order
        # dependence fail here instead of staying a latent assumption. The
        # validator is required: every produced PDF is checked independently.
        env:
          PDF_REQUIRE_VALIDATOR: "1"
        run: go test -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage floor
        # Set from the current number (81%), not from an aspiration: a change
        # that drops below the floor is a regression, and the floor rises with
        # the suite.
        run: |
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "total coverage: ${total}%"
          if awk -v total="$total" 'BEGIN { exit !(total + 0 < 80) }'; then
            echo "coverage ${total}% is below the floor 80%"
            exit 1
          fi

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pdfcpu
        # Pinned to the release named in the unit job.
        run: go install github.com/pdfcpu/pdfcpu/cmd/pdfcpu@v0.16.4
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Race
        # The render tests skip here: only the golden job installs poppler.
        env:
          PDF_REQUIRE_VALIDATOR: "1"
        run: go test -shuffle=on -race ./...

  golden:
    # The render goldens are produced with the poppler of this image:
    # ubuntu-latest is Ubuntu 26.04 and ships poppler 26.01.0, which is the
    # version renderer.txt records. The label floats, so a new image means
    # regenerating the goldens, renderer.txt, docs/golden.md and CONTRIBUTING.md
    # in one change.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install pdfcpu
        # Pinned to the release named in the unit job.
        run: go install github.com/pdfcpu/pdfcpu/cmd/pdfcpu@v0.16.4
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Independent renderer checks
        # The independent text, geometry/colour and transparency checks are the
        # ones that compare the PDF against what another renderer produces, so
        # they must run where poppler is installed. The expected names are
        # listed: a rename that silently drops one from the selection fails here
        # rather than passing with an empty run.
        env:
          PDF_REQUIRE_VALIDATOR: "1"
          PDF_REQUIRE_RENDER: "1"
        run: |
          set -eo pipefail
          expected="TestIndependentRendererSeesContent TestIndependentRendererColoursAndCoordinates TestIndependentRendererCompositesTransparency"
          listed=$(go test ./internal/engine -list '^TestIndependentRenderer')
          for name in $expected; do
            if ! grep -qx "$name" <<<"$listed"; then
              echo "the independent renderer test $name is missing" >&2
              exit 1
            fi
          done
          go test ./internal/engine -run '^TestIndependentRenderer' -count=1 -v | tee independent.log
          if grep -q -- '--- SKIP' independent.log; then
            echo "an independent renderer test skipped:" >&2
            grep -- '--- SKIP' independent.log >&2
            exit 1
          fi
          for name in $expected; do
            if ! grep -q -- "--- PASS: $name " independent.log; then
              echo "the independent renderer test $name did not run and pass" >&2
              exit 1
            fi
          done
      - name: Golden snapshots
        # Runs both snapshot layers explicitly and fails when either one skips.
        # A suite that never ran them is not a gate: PDF_REQUIRE_RENDER makes a
        # missing rasterizer fail here even if another step deleted the install.
        env:
          PDF_REQUIRE_VALIDATOR: "1"
          PDF_REQUIRE_RENDER: "1"
          GOLDEN_ARTIFACTS: ${{ github.workspace }}/artifacts/golden
        run: |
          set -eo pipefail
          go test ./internal/engine \
            -run 'TestDocumentSnapshots|TestRenderSnapshots|TestProfileCoverage' \
            -count=1 -v | tee golden.log
          if grep -q -- '--- SKIP' golden.log; then
            echo "a snapshot test skipped:" >&2
            grep -- '--- SKIP' golden.log >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestDocumentSnapshots ' golden.log
          grep -q -- '--- PASS: TestRenderSnapshots ' golden.log
      - name: Snapshot artifacts
        # Uploaded only when a golden test fails: produced, expected and diff.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-artifacts
          path: artifacts/golden
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz
        # Short runs on the parsers that read untrusted input. A longer fuzz
        # session belongs to a nightly job, not to every pull request.
        run: |
          go test ./internal/font -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s
          go test ./internal/font -run '^$' -fuzz '^FuzzParseClassDef$' -fuzztime 10s
          go test ./internal/html -run '^$' -fuzz '^FuzzParse$' -fuzztime 10s
          go test ./internal/css -run '^$' -fuzz '^FuzzParse$' -fuzztime 10s
          go test ./pdfgen -run '^$' -fuzz '^FuzzConvert$' -fuzztime 15s

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Left off deliberately: the graph is two small modules, and the
          # parallel jobs would restore and race to save the same cache for a
          # few seconds each.
          cache: false
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      # Pinned: findings and action behaviour change between releases.
      # Bump this version and the one in README.md together.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  gate:
    # The single check branch protection requires. It runs even when a job
    # failed, and treats anything but success — failure, skipped, cancelled —
    # as a failure, so a suite that never ran cannot pass.
    needs: [unit, race, golden, fuzz, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: |
          failed=""
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::job $1 reported $2"
              failed="$failed $1($2)"
            fi
          }
          check unit "${{ needs.unit.result }}"
          check race "${{ needs.race.result }}"
          check golden "${{ needs.golden.result }}"
          check fuzz "${{ needs.fuzz.result }}"
          check lint "${{ needs.lint.result }}"
          if [ -n "$failed" ]; then
            echo "required jobs did not succeed:$failed" >&2
            exit 1
          fi
