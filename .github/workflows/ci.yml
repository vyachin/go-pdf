name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: the render goldens are produced with the poppler of this release.
    # An image bump must be a deliberate commit that regenerates them.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The module declares go 1.26: CI must prove that minimum works.
          go-version-file: go.mod
          # go.sum pins the one test-only dependency; caching that download is
          # not worth a stale module cache in a build this short.
          cache: false
      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install pdfcpu
        # Pinned and coupled to the go directive: this release requires
        # Go 1.26, which is exactly the module's minimum. Bump both together.
        run: go install github.com/pdfcpu/pdfcpu/cmd/pdfcpu@v0.16.4
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Vet
        run: go vet ./...
      - name: Reference command uses the public API only
        # cmd/pdfgen is the example of the package. An internal import would
        # turn it into a second entry point into the engine and stop it from
        # demonstrating what a consumer can actually write.
        run: |
          set -o pipefail
          imports="$(go list -f '{{join .Imports "\n"}}' ./cmd/pdfgen)"
          if grep -q -- '/internal/' <<<"$imports"; then
            echo "cmd/pdfgen imports an internal package:" >&2
            grep -- '/internal/' <<<"$imports" >&2
            exit 1
          fi
      - name: Test
        env:
          PDF_REQUIRE_VALIDATOR: "1"
          PDF_REQUIRE_RENDER: "1"
          GOLDEN_ARTIFACTS: ${{ github.workspace }}/artifacts/golden
        run: go test ./...
      - name: Race
        env:
          PDF_REQUIRE_VALIDATOR: "1"
          PDF_REQUIRE_RENDER: "1"
          GOLDEN_ARTIFACTS: ${{ github.workspace }}/artifacts/golden
        run: go test -race ./...
      - name: Golden snapshots
        # Runs both snapshot layers explicitly and fails when either one skips.
        # A suite that never ran them is not a gate: PDF_REQUIRE_RENDER makes a
        # missing rasterizer fail here even if another step deleted the install.
        env:
          PDF_REQUIRE_RENDER: "1"
          GOLDEN_ARTIFACTS: ${{ github.workspace }}/artifacts/golden
        run: |
          set -o pipefail
          go test ./internal/engine \
            -run 'TestDocumentSnapshots|TestRenderSnapshots|TestProfileCoverage' \
            -count=1 -v | tee golden.log
          ! grep -q -- '--- SKIP' golden.log
          grep -q -- '--- PASS: TestDocumentSnapshots ' golden.log
          grep -q -- '--- PASS: TestRenderSnapshots ' golden.log
      - name: Snapshot artifacts
        # Uploaded only when a golden test fails: produced, expected and diff.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-artifacts
          path: artifacts/golden
          if-no-files-found: ignore
      - name: Fuzz
        # Short runs on the parsers that read untrusted input. A longer fuzz
        # session belongs to a nightly job, not to every pull request.
        run: |
          go test ./internal/font -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s
          go test ./internal/font -run '^$' -fuzz '^FuzzParseClassDef$' -fuzztime 10s
          go test ./internal/html -run '^$' -fuzz '^FuzzParse$' -fuzztime 10s
          go test ./internal/css -run '^$' -fuzz '^FuzzParse$' -fuzztime 10s
          go test ./pdfgen -run '^$' -fuzz '^FuzzConvert$' -fuzztime 15s
      - name: Public API from another module
        # The package must be importable by a module outside this repository.
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          go mod init example.com/apicheck
          go mod edit -replace github.com/vyachin/go-pdf="$GITHUB_WORKSPACE"
          cat > main.go <<'EOF'
          package main

          import (
              "context"
              "fmt"

              "github.com/vyachin/go-pdf/pdfgen"
          )

          func main() {
              diags, err := pdfgen.Validate(context.Background(), []byte("<p>x</p>"), pdfgen.Options{})
              fmt.Println(len(diags), err)
          }
          EOF
          go mod tidy
          go build ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.sum pins the one test-only dependency; caching that download is
          # not worth a stale module cache in a build this short.
          cache: false
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      # Pinned: findings and action behaviour change between releases.
      # Bump this version and the one in README.md together.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
